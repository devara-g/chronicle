<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chronicle</title>
  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">CHRONICLE</div>
  <div style="font-size: 11px; color: #666; font-family: monospace;">DIGITAL NOIR MICROBLOG</div>
  <div class="spinner"></div>
  <script>
    setTimeout(function() {
      if (window.location.hostname !== 'lchronicle.vercel.app') {
        window.location.href = "https://lchronicle.vercel.app";
      }
    }, 1000);
  </script>
</body>
</html>
