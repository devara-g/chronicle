<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chronicle - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Geist:wght@400;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#474746",
                        "secondary": "#c7c6c6",
                        "on-background": "#e2e2e2",
                        "background": "#131313",
                        "primary-fixed-dim": "#c6c6c7",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e2e2e2",
                        "on-surface-variant": "#c4c7c8",
                        "outline-variant": "#444748",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#303030",
                        "on-primary-fixed-variant": "#454747",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed": "#1a1c1c",
                        "primary-container": "#e2e2e2",
                        "error-container": "#93000a",
                        "secondary-container": "#484949",
                        "on-primary-container": "#636565",
                        "tertiary": "#ffffff",
                        "surface-variant": "#353535",
                        "inverse-primary": "#5d5f5f",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "surface": "#131313",
                        "surface-container": "#1f1f1f",
                        "primary-fixed": "#e2e2e2",
                        "secondary-fixed": "#e3e2e2",
                        "surface-container-low": "#1b1b1b",
                        "outline": "#8e9192",
                        "on-secondary": "#2f3131",
                        "surface-container-highest": "#353535",
                        "secondary-fixed-dim": "#c7c6c6",
                        "tertiary-fixed": "#e5e2e1",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-bright": "#393939",
                        "on-primary": "#2f3131",
                        "on-secondary-container": "#b8b8b8",
                        "on-tertiary": "#313030",
                        "tertiary-container": "#e5e2e1",
                        "primary": "#ffffff",
                        "surface-tint": "#c6c6c7",
                        "on-error": "#690005",
                        "surface-dim": "#131313",
                        "on-primary-fixed": "#1a1c1c",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-tertiary-container": "#656464",
                        "surface-container-lowest": "#0e0e0e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "max-width-feed": "600px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Geist"],
                        "mono-sm": ["Geist"],
                        "headline-xl": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Transactional Page: Navigation Shell is Intentionally Suppressed -->
<main class="w-full max-w-sm bg-white/5 backdrop-blur-md border border-white/10 rounded-xl p-8 sm:p-10 transition-all duration-300">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tighter">Chronicle</h1>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Input -->
<div>
<label class="sr-only font-body-sm text-body-sm" for="email">Email address</label>
<div class="relative">
<input autocomplete="email" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-primary placeholder:text-outline focus:outline-none focus:border-white/20 focus:bg-white/10 transition-colors font-body-md text-body-md" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="sr-only font-body-sm text-body-sm" for="password">Password</label>
<div class="relative">
<input autocomplete="current-password" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-primary placeholder:text-outline focus:outline-none focus:border-white/20 focus:bg-white/10 transition-colors font-body-md text-body-md pr-10" id="password" name="password" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex items-center justify-between">
<div class="text-sm"></div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-body-md text-body-md font-semibold hover:bg-primary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-primary transition-all duration-150" type="submit">
                    Sign In
                </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                Don't have an account? 
                <a class="text-primary hover:underline hover:text-white transition-colors" href="#">
                    Create an account
                </a>
</p>
</div>
</main>
</body></html>
