<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join Chronicle</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#474746",
                        "secondary": "#c7c6c6",
                        "on-background": "#e2e2e2",
                        "background": "#131313",
                        "primary-fixed-dim": "#c6c6c7",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e2e2e2",
                        "on-surface-variant": "#c4c7c8",
                        "outline-variant": "#444748",
                        "surface-container-high": "#2a2a2a",
                        "inverse-on-surface": "#303030",
                        "on-primary-fixed-variant": "#454747",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed": "#1a1c1c",
                        "primary-container": "#e2e2e2",
                        "error-container": "#93000a",
                        "secondary-container": "#484949",
                        "on-primary-container": "#636565",
                        "tertiary": "#ffffff",
                        "surface-variant": "#353535",
                        "inverse-primary": "#5d5f5f",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "surface": "#131313",
                        "surface-container": "#1f1f1f",
                        "primary-fixed": "#e2e2e2",
                        "secondary-fixed": "#e3e2e2",
                        "surface-container-low": "#1b1b1b",
                        "outline": "#8e9192",
                        "on-secondary": "#2f3131",
                        "surface-container-highest": "#353535",
                        "secondary-fixed-dim": "#c7c6c6",
                        "tertiary-fixed": "#e5e2e1",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-bright": "#393939",
                        "on-primary": "#2f3131",
                        "on-secondary-container": "#b8b8b8",
                        "on-tertiary": "#313030",
                        "tertiary-container": "#e5e2e1",
                        "primary": "#ffffff",
                        "surface-tint": "#c6c6c7",
                        "on-error": "#690005",
                        "surface-dim": "#131313",
                        "on-primary-fixed": "#1a1c1c",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-tertiary-container": "#656464",
                        "surface-container-lowest": "#0e0e0e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "max-width-feed": "600px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Geist"],
                        "mono-sm": ["Geist"],
                        "headline-xl": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }]

                }
            }
        }

</head>
<body class="bg-black text-primary min-h-screen flex items-center justify-center p-4 antialiased selection:bg-white/20">
<main class="w-full max-w-[420px]">
<!-- Brand Header -->
<div class="text-center mb-8">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tighter mb-2">Chronicle</h1>
<p class="font-body-md text-body-md text-secondary">Join Chronicle</p>
</div>
<!-- Glassmorphic Container -->
<div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-8 shadow-2xl">
<form class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary" for="fullName">Full Name</label>
<input class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 font-body-md text-body-md text-primary placeholder-outline focus:outline-none focus:border-white/30 focus:bg-white/10 transition-colors duration-150" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary" for="email">Email Address</label>
<input class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 font-body-md text-body-md text-primary placeholder-outline focus:outline-none focus:border-white/30 focus:bg-white/10 transition-colors duration-150" id="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary" for="username">Username</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-secondary font-body-md text-body-md">@</span>
<input class="w-full bg-white/5 border border-white/10 rounded-lg pl-8 pr-4 py-3 font-body-md text-body-md text-primary placeholder-outline focus:outline-none focus:border-white/30 focus:bg-white/10 transition-colors duration-150" id="username" placeholder="janedoe" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary" for="password">Password</label>
<input class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 font-body-md text-body-md text-primary placeholder-outline focus:outline-none focus:border-white/30 focus:bg-white/10 transition-colors duration-150" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-white/10 bg-white/5 text-primary focus:ring-0 focus:ring-offset-0 transition-colors duration-150 cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-secondary cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Primary Submit Button -->
<button class="w-full bg-primary text-background font-headline-lg text-[16px] leading-[24px] tracking-normal py-3 rounded-lg hover:bg-secondary transition-colors duration-150 mt-2 flex justify-center items-center gap-2" type="submit">
                    Create Account
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-6">
<div class="flex-1 h-px bg-white/10"></div>
<span class="font-label-caps text-label-caps text-secondary">OR</span>
<div class="flex-1 h-px bg-white/10"></div>
</div>
<!-- Social Options -->
<div class="flex flex-col gap-3">
<button class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-3 font-body-md text-body-md text-primary hover:bg-white/5 transition-colors duration-150 flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-3 font-body-md text-body-md text-primary hover:bg-white/5 transition-colors duration-150 flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.8 3.59-.8 1.51.05 2.7.55 3.55 1.5-3.15 1.83-2.63 5.56.32 6.66-1.01 2.22-2.15 3.8-2.54 4.81zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
                    Continue with Apple
                </button>
</div>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Already have an account? <a class="text-primary hover:underline underline-offset-2" href="#">Log in</a>
</p>
</div>
</div>
</main>
</body></html>
